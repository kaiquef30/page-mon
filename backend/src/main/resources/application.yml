spring:
  application:
    name: page-change-monitor

  datasource:
    url: jdbc:h2:mem:pagemon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    placeholders:
      lob: CLOB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      cors:
        allowed-origins:
          - "http://localhost:8081"
          - "http://127.0.0.1:8081"
          - "http://localhost:8081"
          - "http://127.0.0.1:8081"
        allowed-methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowed-headers:
          - "*"
        allow-credentials: true
        max-age: 3600
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui

monitor:
  scheduler:
    fixed-delay: PT30S

  fetch:
    timeout: PT20S
    user-agent: "page-change-monitor/1.0 (+https://github.com/)"

  lock:
    enabled: false
    key-prefix: "pagemon:${spring.application.name}:${spring.profiles.active:default}"
    wait-time: PT0S
    lease-time: PT3M
    fair: false

  executor:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 50

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/pagemon
    username: pagemon
    password: pagemon
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    placeholders:
      lob: TEXT

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

monitor:
  scheduler:
    fixed-delay: PT30S
    batch-size: 50
  lock:
    enabled: ${MONITOR_LOCK_ENABLED:false}
    lease-time: ${MONITOR_LOCK_LEASE:PT3M}
  executor:
    core-pool-size: ${MONITOR_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${MONITOR_EXECUTOR_MAX_POOL_SIZE:10}
    queue-capacity: ${MONITOR_EXECUTOR_QUEUE_CAPACITY:50}
