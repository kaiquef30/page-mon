services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pagemon
      POSTGRES_USER: pagemon
      POSTGRES_PASSWORD: pagemon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagemon -d pagemon"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
